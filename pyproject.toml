[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "research-agent"
version = "0.1.0"
description = "LangGraph-orchestrated multi-agent OSINT research system"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.1",
    "langgraph-checkpoint-sqlite",
    "langsmith",
    "pydantic>=2.0",
    "anthropic>=0.40",
    "openai>=1.50",
    "google-genai>=1.0",
    "neo4j>=5.0",
    "httpx>=0.27",
    "tenacity>=8.0",
    "structlog>=24.0",
    "trafilatura>=1.12",
    "python-dotenv>=1.0",
    "exa-py>=1.0",
    "firecrawl-py>=1.0",
    "pyyaml>=6.0",
    "rapidfuzz>=3.0",
    "jinja2>=3.1",
    "aiosqlite>=0.22.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.6",
    "streamlit>=1.38",
    "networkx>=3.0",
    "plotly>=5.0",
]

[project.scripts]
research-agent = "research_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/research_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["research_agent"]
